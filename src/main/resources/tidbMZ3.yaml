sys.zone2.pods: tidb3-tidb-0,tidb3-tidb-3,tidb3-tikv-1,tidb3-tikv-5
sys.zone3.pods: tidb3-tidb-4,tidb3-tidb-5,tidb3-tikv-0,tidb3-tikv-4
